name: Registry

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate plugin entries
        run: node app/scripts/validate-registry.mjs

  rebuild:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild registry.json from app/plugins
        run: node app/scripts/build-registry.mjs
      - name: Commit generated registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/registry.json
          git diff --cached --quiet && echo "registry.json is up to date" || (git commit -m "chore: rebuild registry.json" && git push)
